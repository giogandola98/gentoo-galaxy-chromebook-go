[DEFAULT]
main-repo = gentoo

[gentoo]
location = /var/db/repos/gentoo
sync-type = rsync
sync-uri = rsync://rsync.gentoo.org/gentoo-portage
auto-sync = yes

[guru]
location = /var/db/repos/guru
sync-type = git
sync-uri = https://github.com/gentoo-mirror/guru.git
auto-sync = yes

# Ebuilds of this project (overlay/ in the repo): copied into the builder image and,
# on the Chromebook, by install.sh. Not in /var/db/repos, which is a volume.
[sasuke]
location = /var/db/sasuke-overlay
auto-sync = no
