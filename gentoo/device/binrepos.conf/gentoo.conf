# Official Gentoo binary packages (signed by Gentoo), used only as a fallback:
# our builder's packages (priority 10) always win. Official packages are generic
# x86-64 and are picked only when their USE flags match ours.
[gentoo]
priority = 1
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64
location = /var/cache/binhost/gentoo
verify-signature = true
