# Packages built for the Celeron by the Docker builder, reached over Tailscale.
# Change "cachyos-home" (Tailscale MagicDNS name) if the builder moves to another machine.
[sasuke]
priority = 10
sync-uri = http://cachyos-home:8780
# signed by the builder key (trusted in /etc/portage/gnupg, see README)
verify-signature = true
