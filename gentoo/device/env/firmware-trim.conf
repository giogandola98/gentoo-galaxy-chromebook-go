# Install only the firmware the SASUKE hardware loads (Jasper Lake / Intel only).
# Used by linux-firmware, sof-firmware and intel-microcode, which ship files for
# every vendor/CPU (~2.2 GB); this keeps ~25 MB.
# The microcode for this CPU (06-9c-00) goes into the initramfs (dracut early_microcode),
# so the all-CPU /boot/intel-uc.img is not needed.
# Paths are /lib/firmware: that is how the package records them (merged-usr).
# Check what the kernel loads with:  journalctl -k -b | grep 'Loading firmware'
INSTALL_MASK="/lib/firmware
  -/lib/firmware/regulatory.db*
  -/lib/firmware/iwlwifi-QuZ-a0-hr-b0-*
  -/lib/firmware/intel/iwlwifi/iwlwifi-QuZ-a0-hr-b0-*
  -/lib/firmware/intel/ibt-19-0-*
  -/lib/firmware/intel/sof*jsl*
  -/lib/firmware/i915/ehl_*
  -/lib/firmware/i915/icl_*
  -/lib/firmware/rtl_nic
  -/lib/firmware/intel-ucode/06-9c-00
  /boot/intel-uc.img
  /usr/lib/kernel/preinst.d/35-intel-microcode.install
  /usr/lib/kernel/install.d/35-intel-microcode-systemd.install
  /boot/amd-uc.img
  /usr/bin/make-amd-ucode-img
  /usr/lib/kernel/preinst.d/35-amd-microcode.install
  /usr/lib/kernel/install.d/35-amd-microcode-systemd.install"
