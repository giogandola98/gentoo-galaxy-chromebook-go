# Samsung Galaxy Chromebook Go (SASUKE) - Celeron N4500 (Jasper Lake / Tremont)
# make.conf for the CHROMEBOOK. Packages come prebuilt from the builder (Docker, see builder/).
# If something is ever compiled here, use every instruction of the Celeron.
COMMON_FLAGS="-O2 -pipe -march=tremont -mtune=tremont"
MAKEOPTS="-j4 -l4"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=x86-64-v2 -C opt-level=3"
CPU_FLAGS_X86="aes mmx mmxext pclmul popcnt rdrand sse sse2 sse3 sse4_1 sse4_2 ssse3"

EMERGE_DEFAULT_OPTS="--getbinpkgonly --binpkg-respect-use=y --with-bdeps=n"
PORTAGE_NICENESS=10
FEATURES="getbinpkg parallel-fetch"
BINPKG_FORMAT="gpkg"
BINPKG_COMPRESS="zstd"

USE="wayland X pipewire screencast vaapi vulkan bluetooth networkmanager iwd \
     -bindist -telemetry -gnome -kde -qt5 -plasma -cups -doc -handbook -gtk-doc -test -examples -dvd -cdr"
VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"
L10N="it en"
ACCEPT_LICENSE="*"
GRUB_PLATFORMS="efi-64"

LC_MESSAGES=C.UTF-8

# Space on the eMMC: no docs/man/info, translations only for it/en (L10N above).
INSTALL_MASK="/usr/share/doc /usr/share/man /usr/share/info /usr/share/gtk-doc
  /usr/share/locale -/usr/share/locale/locale.alias -/usr/share/locale/it* -/usr/share/locale/en*"

# written by sasuke-update: extra USE of the ULTRA builder (empty for the normal one)
source /etc/portage/variant.conf
