# Samsung Galaxy Chromebook Go (SASUKE) - Celeron N4500 (Jasper Lake / Tremont)
# COMMON_FLAGS and MAKEOPTS are generated at builder startup in /etc/portage/cpu.conf
# (see builder/builder.sh): -march=tremont, minus only the Celeron instructions the
# build PC's CPU lacks (otherwise programs run during the build would crash).
source /etc/portage/cpu.conf
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=x86-64-v2 -C opt-level=3"
CPU_FLAGS_X86="aes mmx mmxext pclmul popcnt rdrand sse sse2 sse3 sse4_1 sse4_2 ssse3"

EMERGE_DEFAULT_OPTS="--jobs=2 --with-bdeps=y --keep-going --binpkg-respect-use=y"
FEATURES="buildpkg parallel-fetch -ipc-sandbox -network-sandbox -pid-sandbox -mount-sandbox"
BINPKG_FORMAT="gpkg"
BINPKG_COMPRESS="zstd"

USE="wayland X pipewire screencast vaapi vulkan bluetooth networkmanager iwd \
     -bindist -telemetry -gnome -kde -qt5 -plasma -cups -doc -handbook -gtk-doc -test -examples -dvd -cdr"
VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"
L10N="it en"
ACCEPT_LICENSE="*"
GRUB_PLATFORMS="efi-64"

LC_MESSAGES=C.UTF-8
# package signing (generated by "builder cpu"); must stay last so FEATURES is extended
source /etc/portage/signing.conf
source /etc/portage/late.conf
