hostonly="yes"
compress="zstd"
add_drivers+=" mmc_block sdhci_pci ext4 "
omit_dracutmodules+=" plymouth "
# v4l2loopback: modules-load.d also runs in the initramfs, where the module was missing
# i915: modeset before greetd starts, otherwise the login screen is drawn twice (simpledrm -> i915)
add_drivers+=" v4l2loopback i915 "
