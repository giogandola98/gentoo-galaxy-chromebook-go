# Samsung Galaxy Chromebook Go (SASUKE) - ChromeOS-style top row
# The keyboard (coreboot/MrChromebox) already sends "action" codes (back, forward,
# refresh, zoom, scale, brightness*, mute, volume*). Here they become universal:
#   ← = Alt+Left (back), → = Alt+Right (forward), ⟳ = F5, ⛶ = F11 (fullscreen)
#   ▭||| (scale) stays as is: labwc uses it to open the app menu.
# "Search" key (leftmeta) + top row = real F1..F10.
[ids]
k:0001:0001

[main]
back = A-left
forward = A-right
refresh = f5
zoom = f11

[meta]
back = f1
forward = f2
refresh = f3
zoom = f4
scale = f5
brightnessdown = f6
brightnessup = f7
mute = f8
volumedown = f9
volumeup = f10
backspace = delete
up = pageup
down = pagedown
left = home
right = end
# ○ + key right of 0 = F11, ○ + the next key = F12 (as on ChromeOS)
minus = f11
equal = f12
