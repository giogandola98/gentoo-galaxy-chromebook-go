#!/usr/sbin/nft -f
# SASUKE firewall: nothing reaches the Chromebook from outside, except through Tailscale.
# only our own table: never touch the rules Tailscale/Docker add
table inet sasuke
delete table inet sasuke

table inet sasuke {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    iifname "tailscale0" accept                      # tailnet: SSH, RDP/VNC replies, etc.
    udp dport 41641 accept                           # Tailscale direct (peer-to-peer) connections
    meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
    meta l4proto ipv6-icmp accept                    # IPv6 needs ICMPv6 (neighbour discovery)
    udp sport 67 udp dport 68 accept                 # DHCPv4
    udp dport 546 ip6 saddr fe80::/10 accept         # DHCPv6
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
    iifname "tailscale0" accept                      # needed only if offered as exit node
    oifname "tailscale0" ct state established,related accept
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
