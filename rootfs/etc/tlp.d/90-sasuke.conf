# SASUKE (Celeron N4500, Jasper Lake) - TLP power profiles
# Three modes (pick from the top bar, profile icon):
#   AC  = charger plugged in      -> responsive
#   BAT = on battery (balanced)   -> saves power without getting sluggish
#   SAV = maximum power saving    -> for long trips
# AC/BAT switching is automatic when the charger is unplugged.

# Wi-Fi and Bluetooth come back as you left them (state saved at shutdown)
RESTORE_DEVICE_STATE_ON_STARTUP=1

# CPU (intel_pstate active, HWP): energy/performance preference
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
# Turbo: always available except in max saving (without turbo the Celeron stays at 1.1 GHz)
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=100
CPU_MAX_PERF_ON_SAV=70

# Intel UHD GPU: handled automatically by i915 (RC6, PSR, FBC on by default)

# PCIe bus, disks, USB
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
USB_AUTOSUSPEND=1

# Wi-Fi: power saving on battery only
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Audio: power down the codec after 1 s of silence on battery
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
